spring:
  application:
    name: configuration-profile-sample
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api

app:
  name: Configuration Profile Sample
  description: Spring Boot Configuration 샘플 애플리케이션
  environment: common

  external-api:
    base-url: https://api.example.com
    connect-timeout: 3s
    read-timeout: 5s
    api-key: ${APP_API_KEY:local-test-key}

  storage:
    type: local
    directory: ./uploads
    max-file-size: 10MB

  security:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    admin-email: admin@example.com

logging:
  level:
    root: INFO
    com.example.configsample: INFO

management:
  endpoint:
    info:
      # info endpoint 자체를 비활성화합니다.
      access: none

    env:
      # 환경변수 값을 Actuator 응답에 표시합니다.
      # 민감정보가 노출될 수 있으므로 로컬 실습에서만 사용합니다.
      show-values: always

  endpoints:
    web:
      exposure:
        # 모든 Actuator endpoint를 HTTP에 노출합니다.
        include: "*"

        # 전체 노출 대상에서 beans와 metrics는 제외합니다.
        exclude:
          - beans
          - metrics
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중고차 목록 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>중고차 목록 관리</h1>
    <p>차량 정보를 등록하고 관리해 보세요.</p>
  </header>

  <main>
    <section>
      <h2>차량 정보 입력</h2>
      <form id="carForm" novalidate>
        <label>제조사
          <select id="makerInput" required>
            <option value="">제조사 선택</option>
            <option>현대</option><option>기아</option><option>제네시스</option>
            <option>쉐보레</option><option>르노</option>
          </select>
        </label>
        <label>모델명
          <input id="modelInput" placeholder="예: 쏘나타" required>
        </label>
        <label>연식
          <input id="yearInput" type="number" min="1990" placeholder="예: 2021" required>
        </label>
        <label>주행거리(km)
          <input id="mileageInput" type="number" min="0" placeholder="예: 43000" required>
        </label>
        <label>가격(만원)
          <input id="priceInput" type="number" min="1" placeholder="예: 1850" required>
        </label>
        <label>연료
          <select id="fuelInput" required>
            <option value="">연료 선택</option>
            <option>가솔린</option><option>디젤</option><option>LPG</option>
            <option>하이브리드</option><option>전기</option>
          </select>
        </label>
        <label>판매 상태
          <select id="statusInput">
            <option>판매중</option><option>예약중</option><option>판매완료</option>
          </select>
        </label>
        <div class="form-actions">
          <button id="submitButton" type="submit">등록</button>
          <button id="cancelEditButton" type="button" class="secondary" hidden>수정 취소</button>
        </div>
      </form>
    </section>

    <section>
      <div class="list-heading">
        <h2>차량 목록</h2>
        <span id="countText"></span>
      </div>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="제조사 또는 모델명 검색">
        <select id="statusFilter" aria-label="판매 상태 필터">
          <option>전체</option><option>판매중</option><option>예약중</option><option>판매완료</option>
        </select>
      </div>
      <p id="emptyMessage" class="empty">등록된 차량이 없습니다.</p>
      <div id="carList" class="car-list"></div>
    </section>
  </main>
</body>
</html>

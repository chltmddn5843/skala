openapi: 3.0.3
info:
  title: PartFlow MES API
  description: >
    LOT 단위 생산·품질 기록 통합 조회 및 AI 인수인계 초안 생성을 지원하는
    교육용 MES 서비스 API 명세서. 검사는 개별 측정값을 규격(inspection_specs)과
    비교해 서버가 PASS/FAIL을 자동 판정하는 방식이다. Security Schemes는
    평가 범위에서 제외함.


    공통 규칙: POST /auth/login을 제외한 모든 엔드포인트는 로그인 세션이
    필요하며, 세션이 없으면 401을 반환한다(개별 엔드포인트마다 반복 기술하지
    않음). 날짜/시간은 ISO 8601(예: 2026-09-08T09:00:00)을 사용한다.
    공통 에러 응답 형식은 Error 스키마를 따른다 — 상세는 Appendix B(예외·에러
    처리) 참고.
  version: "1.2.0"
servers:
  - url: http://localhost:8080/api

tags:
  - name: Auth
  - name: Products
  - name: Equipment
  - name: WorkOrders
  - name: Lots
  - name: Dashboard

paths:
  # ---------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "operator01" }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: 아이디 또는 비밀번호 불일치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      responses:
        "200":
          description: 로그아웃 성공

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인한 사용자 정보 조회
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: 로그인 필요
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------
  # Reference data
  # ---------------------------------------------------------------
  /products:
    get:
      tags: [Products]
      summary: 품목 목록 조회
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /equipment:
    get:
      tags: [Equipment]
      summary: 설비 목록 조회 (LOT 등록 화면 드롭다운용)
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Equipment" }

  # ---------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------
  /dashboard:
    get:
      tags: [Dashboard]
      summary: 생산·품질 현황 조회
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: LOT 생산일(started_at) 기준 시작일
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: productId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }
        "400":
          description: 잘못된 기간 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------
  # Work Orders
  # ---------------------------------------------------------------
  /work-orders:
    get:
      tags: [WorkOrders]
      summary: 작업지시 목록 조회
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WorkOrderStatus" }
        - name: productId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkOrder" }
    post:
      tags: [WorkOrders]
      summary: 작업지시 등록 (생산관리자)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, targetQty, dueDate]
              properties:
                productId: { type: integer }
                targetQty: { type: integer, minimum: 1 }
                dueDate: { type: string, format: date }
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "400":
          description: 목표수량 오류 또는 존재하지 않는 품목
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 생산관리자 권한 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work-orders/{id}:
    get:
      tags: [WorkOrders]
      summary: 작업지시 상세 조회 (누적 생산량 + 연결 LOT 목록 포함)
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrderDetail" }
        "404":
          description: 존재하지 않는 지시
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work-orders/{id}/start:
    post:
      tags: [WorkOrders]
      summary: 작업 시작 (작업자)
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      responses:
        "200":
          description: 시작 처리 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "403":
          description: 작업자 권한 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: PLANNED 상태가 아니어서 시작 불가
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work-orders/{id}/close:
    post:
      tags: [WorkOrders]
      summary: 작업지시 종료 (생산관리자)
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                closeReason:
                  type: string
                  description: 누적 생산량이 목표수량보다 적을 때 필수
      responses:
        "200":
          description: 종료 처리 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "400":
          description: 목표 미달인데 closeReason 누락
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 생산관리자 권한 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: IN_PROGRESS 상태가 아니어서 종료 불가
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work-orders/{id}/lots:
    post:
      tags: [WorkOrders]
      summary: LOT 생산실적 등록 (작업자)
      description: >
        spec_id는 클라이언트가 지정하지 않는다. 서버가 productId 기준
        최신 버전 inspection_specs를 조회해 LOT에 자동으로 연결한다.
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lotNo, equipmentId, producedQty, startedAt, endedAt]
              properties:
                lotNo: { type: string, example: "LOT-A" }
                equipmentId: { type: integer }
                producedQty: { type: integer, minimum: 1 }
                startedAt: { type: string, format: date-time }
                endedAt: { type: string, format: date-time }
                productionNote: { type: string }
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionLot" }
        "400":
          description: 수량 오류 / endedAt이 startedAt보다 이르지 않음 / 해당 품목의 활성 규격 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: LOT번호 중복 / 지시 종료됨 / 목표수량 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work-orders/{id}/lots/{lotId}/anomalies:
    post:
      tags: [WorkOrders]
      summary: LOT 이상징후 등록 (작업자)
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
        - name: lotId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anomalyType, anomalyDetectedAt, anomalyNote]
              properties:
                anomalyType: { type: string, example: "소음" }
                anomalyDetectedAt: { type: string, format: date-time }
                anomalyNote: { type: string }
      responses:
        "200":
          description: 등록 성공 (LOT 품질상태가 '확인대기'로 전환됨)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionLot" }
        "400":
          description: 필수값 누락
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 존재하지 않는 LOT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------
  # Lots
  # ---------------------------------------------------------------
  /lots:
    get:
      tags: [Lots]
      summary: LOT 목록 조회
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: productId
          in: query
          schema: { type: integer }
        - name: lotNo
          in: query
          schema: { type: string }
        - name: inspectionStatus
          in: query
          schema:
            type: string
            enum: [확인대기, 검사대기, 검사완료]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedLotList" }

  /lots/{id}:
    get:
      tags: [Lots]
      summary: LOT 상세 조회 (생산·규격·검사·측정값·AI요약·검토이력 통합)
      parameters:
        - $ref: "#/components/parameters/LotId"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LotDetail" }
        "404":
          description: 존재하지 않는 LOT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lots/{id}/related:
    get:
      tags: [Lots]
      summary: 관련 LOT 후보 조회 (같은 품목·같은 설비·같은 생산일)
      parameters:
        - $ref: "#/components/parameters/LotId"
      responses:
        "200":
          description: 조회 성공 (0건이면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelatedLot" }
        "404":
          description: 존재하지 않는 LOT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lots/{id}/inspection:
    post:
      tags: [Lots]
      summary: 최종검사 확정 (품질담당자)
      description: >
        measurements 배열의 개수는 LOT의 producedQty와 같아야 한다(전수검사).
        각 measuredValue는 서버가 LOT에 연결된 규격(inspection_specs)의
        lowerLimit/upperLimit과 비교해 PASS/FAIL을 자동 판정한다.
        클라이언트는 result 값을 보낼 수 없다.
      parameters:
        - $ref: "#/components/parameters/LotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspectedAt, measurements]
              properties:
                inspectedAt: { type: string, format: date-time }
                inspectionNote: { type: string }
                measurements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemNo, measuredValue]
                    properties:
                      itemNo: { type: integer, minimum: 1 }
                      measuredValue: { type: number, format: float }
      responses:
        "201":
          description: 검사 확정 성공 (측정값별 PASS/FAIL, 합격/부적합 집계 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "400":
          description: measurements 개수가 producedQty와 불일치 / itemNo 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 존재하지 않는 LOT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 이미 검사 확정된 LOT (중복)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lots/{id}/ai-summaries:
    post:
      tags: [Lots]
      summary: AI 인수인계 초안 생성 (품질담당자)
      description: >
        기준 LOT(path의 id)은 항상 요약 대상에 포함된다. relatedLotIds를 함께 보내면
        GET /lots/{id}/related 결과에 포함된 LOT에 한해 같이 분석하며, 실제로 사용한
        LOT 목록은 ai_summary_related_lots에 스냅샷으로 저장되어 이후 재현·감사가
        가능하다. relatedLotIds를 생략하면 기준 LOT만으로 요약한다.
      parameters:
        - $ref: "#/components/parameters/LotId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                relatedLotIds:
                  type: array
                  items: { type: integer }
                  description: "GET /lots/{id}/related 결과에 포함된 lotId만 허용. 기준 LOT 자신은 자동 포함되므로 넣지 않는다."
      responses:
        "201":
          description: >
            생성 처리 완료. status가 FAILED여도 201로 응답하며 이력으로 저장됨
            (summaryText는 이 경우 null).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSummary" }
        "400":
          description: 검사 미완료 상태에서 요청함 / relatedLotIds에 관련 LOT 후보가 아닌 ID 포함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 존재하지 않는 LOT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai-summaries/{id}/reviews:
    post:
      tags: [Lots]
      summary: AI 요약 검토본 저장 (품질담당자)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewedText]
              properties:
                reviewedText: { type: string }
      responses:
        "201":
          description: 검토본 저장 성공 (원문 summaryText는 변경되지 않음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryReview" }
        "400":
          description: 검토문 누락 / 원문이 FAILED 상태라 검토 대상 아님
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 존재하지 않는 요약
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    WorkOrderId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    LotId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  schemas:
    UserRole:
      type: string
      enum: [MANAGER, OPERATOR, QUALITY]

    WorkOrderStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, CLOSED]

    MeasurementResult:
      type: string
      enum: [PASS, FAIL]

    AiSummaryStatus:
      type: string
      enum: [SUCCESS, FAILED]

    LotQualityStatus:
      type: string
      description: >
        계산 필드(DB 미저장). anomaly_type 존재+검사 없음=확인대기,
        anomaly_type 없음+검사 없음=검사대기, 검사 존재=검사완료
      enum: [확인대기, 검사대기, 검사완료]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    Product:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: "BR-A" }
        name: { type: string }

    Equipment:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: "M1" }
        name: { type: string }

    InspectionSpec:
      type: object
      description: LOT 생산 시점에 적용된 규격 스냅샷 (버전 고정)
      properties:
        featureName: { type: string, example: "구멍 지름" }
        targetValue: { type: number, example: 10.0 }
        lowerLimit: { type: number, example: 9.90 }
        upperLimit: { type: number, example: 10.10 }
        unit: { type: string, example: "mm" }
        version: { type: string, example: "v1" }

    WorkOrder:
      type: object
      description: >
        목록(GET /work-orders) 화면이 품목명을 바로 표시하고 생산/목표를
        보여줘야 하므로, product 요약과 producedQtyTotal을 목록 단계부터
        포함한다(상세 조회 때만 주는 것이 아님).
      properties:
        id: { type: integer }
        orderNo: { type: string, example: "WO-0908-01" }
        product: { $ref: "#/components/schemas/Product" }
        targetQty: { type: integer }
        producedQtyTotal:
          type: integer
          description: "계산값 = Σproduction_lots.produced_qty (해당 지시)"
        dueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/WorkOrderStatus" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true }

    WorkOrderDetail:
      allOf:
        - $ref: "#/components/schemas/WorkOrder"
        - type: object
          properties:
            lots:
              type: array
              items: { $ref: "#/components/schemas/ProductionLot" }

    ProductionLot:
      type: object
      properties:
        id: { type: integer }
        lotNo: { type: string }
        workOrderId: { type: integer }
        equipmentId: { type: integer }
        equipmentCode: { type: string, example: "M1" }
        spec: { $ref: "#/components/schemas/InspectionSpec" }
        producedQty: { type: integer }
        operatorId: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        productionNote: { type: string, nullable: true }
        anomalyType: { type: string, nullable: true }
        anomalyDetectedAt: { type: string, format: date-time, nullable: true }
        anomalyNote: { type: string, nullable: true }
        qualityStatus: { $ref: "#/components/schemas/LotQualityStatus" }

    LotDetail:
      allOf:
        - $ref: "#/components/schemas/ProductionLot"
        - type: object
          properties:
            inspection:
              allOf:
                - $ref: "#/components/schemas/Inspection"
              nullable: true
            aiSummaries:
              type: array
              items: { $ref: "#/components/schemas/AiSummary" }

    RelatedLot:
      type: object
      properties:
        lotId: { type: integer }
        lotNo: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        inspectionStatus: { $ref: "#/components/schemas/LotQualityStatus" }
        matchReason:
          type: string
          example: "같은 BR-A · M1 · 같은 생산일"

    Measurement:
      type: object
      properties:
        itemNo: { type: integer }
        measuredValue: { type: number }
        result: { $ref: "#/components/schemas/MeasurementResult" }

    Inspection:
      type: object
      properties:
        id: { type: integer }
        lotId: { type: integer }
        inspectorId: { type: integer }
        inspectedAt: { type: string, format: date-time }
        inspectionNote: { type: string, nullable: true }
        measurements:
          type: array
          items: { $ref: "#/components/schemas/Measurement" }
        passCount:
          type: integer
          description: "계산값 = COUNT(measurements WHERE result=PASS)"
        failCount:
          type: integer
          description: "계산값 = COUNT(measurements WHERE result=FAIL)"
        defectRate:
          type: string
          description: "계산값, 예: '4.00%'"

    AiSummary:
      type: object
      properties:
        id: { type: integer }
        lotId: { type: integer }
        status: { $ref: "#/components/schemas/AiSummaryStatus" }
        summaryText: { type: string, nullable: true }
        relatedLotIds:
          type: array
          items: { type: integer }
          description: "요약 생성 시점에 실제로 함께 분석한 관련 LOT ID 스냅샷 (ai_summary_related_lots)"
        model: { type: string }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }

    SummaryReview:
      type: object
      properties:
        id: { type: integer }
        summaryId: { type: integer }
        reviewedText: { type: string }
        reviewerId: { type: integer }
        reviewedAt: { type: string, format: date-time }

    PagedLotList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductionLot" }
        totalCount: { type: integer }
        page: { type: integer }
        size: { type: integer }

    EquipmentStatus:
      type: object
      description: 현황 화면 '설비별 작업 상태' 카드가 사용하는 실시간 스냅샷
      properties:
        equipmentId: { type: integer }
        equipmentCode: { type: string, example: "M1" }
        status:
          type: string
          enum: [가동, 대기]
          description: "가동 = 진행중(IN_PROGRESS) 지시에 연결된 LOT이 오늘 등록됨, 그 외 대기"
        currentOrderNo: { type: string, nullable: true }
        producedQty: { type: integer, nullable: true }
        targetQty: { type: integer, nullable: true }

    DashboardResponse:
      type: object
      properties:
        activeWorkOrderCount:
          type: integer
          description: "status=IN_PROGRESS인 작업지시 수"
        producedQty: { type: integer }
        inspectedQty:
          type: integer
          description: "Σ(inspections.measurements 개수)"
        defectRate:
          type: string
          description: "Σfailcount/ΣinspectedQty×100, 검사 0건이면 '검사 데이터 없음'"
        pendingInspectionCount: { type: integer }
        equipmentStatus:
          type: array
          items: { $ref: "#/components/schemas/EquipmentStatus" }

    Error:
      type: object
      properties:
        code: { type: string, example: "MEASUREMENT_COUNT_MISMATCH" }
        message: { type: string, example: "측정값 개수는 생산수량과 일치해야 합니다." }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

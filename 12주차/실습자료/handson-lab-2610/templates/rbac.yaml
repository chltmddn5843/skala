# 실습 18: 권한을 제한한다
# 이 SA 로 발급한 토큰은 Pod · Service 조회만 된다.
#   auth can-i get pods      --token=...  => yes
#   auth can-i get secrets   --token=...  => no
#   auth can-i delete deploy --token=...  => no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __ID__-dev
  labels: {owner: __ID__}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: __ID__-dev-read
  labels: {owner: __ID__}
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: __ID__-dev-read
  labels: {owner: __ID__}
subjects:
  - kind: ServiceAccount
    name: __ID__-dev
roleRef:
  kind: Role
  name: __ID__-dev-read
  apiGroup: rbac.authorization.k8s.io

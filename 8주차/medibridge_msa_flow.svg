<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3478F6"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#FF8A24"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity=".12"/></filter>
    <style>
      .title{font:700 48px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172033}.sub{font:400 22px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#667085}.head{font:700 24px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172033}.body{font:400 18px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#667085}.white{fill:#fff}.label{font:700 17px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.rest{stroke:#3478F6;stroke-width:5;fill:none;marker-end:url(#blueArrow)}.event{stroke:#FF8A24;stroke-width:5;fill:none;stroke-dasharray:13 10;marker-end:url(#orangeArrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="70" y="85" class="title">메디브릿지 MSA 서비스 흐름</text>
  <text x="70" y="125" class="sub">API Gateway를 통한 REST 호출과 Kafka 기반 결제 완료 이벤트</text>

  <!-- connectors first -->
  <path class="rest" d="M270 245H410"/><path class="rest" d="M590 245H720"/>
  <path class="rest" d="M830 305V405H230V470"/><path class="rest" d="M830 305V405H515V470"/><path class="rest" d="M830 305V405H800V470"/><path class="rest" d="M830 305V405H1085V470"/><path class="rest" d="M830 305V405H1370V470"/>
  <path class="event" d="M1085 650V755H940"/><path class="event" d="M790 755H790V650"/>
  <path class="rest" d="M890 560H990"/><path class="rest" d="M890 600H1275"/>

  <!-- top -->
  <rect x="70" y="185" width="200" height="120" rx="24" fill="#17365D" filter="url(#shadow)"/><text x="170" y="235" text-anchor="middle" class="head white">Web / App</text><text x="170" y="270" text-anchor="middle" class="body white">약국·병원 구매 담당자</text>
  <rect x="410" y="185" width="180" height="120" rx="24" fill="#EAF2FF" stroke="#3478F6" stroke-width="3" filter="url(#shadow)"/><text x="500" y="235" text-anchor="middle" class="head">API Gateway</text><text x="500" y="272" text-anchor="middle" class="body">단일 진입점</text>
  <rect x="720" y="185" width="220" height="120" rx="24" fill="#fff" stroke="#D4DAE5" stroke-width="2" filter="url(#shadow)"/><text x="830" y="228" text-anchor="middle" class="head">인증 · 서비스 탐색</text><text x="830" y="267" text-anchor="middle" class="body">OAuth2 / Eureka</text>
  <text x="328" y="225" class="label" fill="#3478F6">HTTPS</text><text x="635" y="225" class="label" fill="#3478F6">인증</text>

  <!-- services -->
  <g filter="url(#shadow)"><rect x="120" y="470" width="220" height="180" rx="20" fill="#fff" stroke="#D4DAE5" stroke-width="2"/><rect x="405" y="470" width="220" height="180" rx="20" fill="#fff" stroke="#D4DAE5" stroke-width="2"/><rect x="690" y="470" width="220" height="180" rx="20" fill="#fff" stroke="#D4DAE5" stroke-width="2"/><rect x="975" y="470" width="220" height="180" rx="20" fill="#fff" stroke="#D4DAE5" stroke-width="2"/><rect x="1260" y="470" width="220" height="180" rx="20" fill="#EAF2FF" stroke="#3478F6" stroke-width="3"/></g>
  <text x="230" y="525" text-anchor="middle" class="head">partner-service</text><text x="230" y="568" text-anchor="middle" class="body">계정 · 거래처 관리</text><text x="230" y="608" text-anchor="middle" class="body">users DB</text>
  <text x="515" y="525" text-anchor="middle" class="head">product-service</text><text x="515" y="568" text-anchor="middle" class="body">의약품 등록 · 조회</text><text x="515" y="608" text-anchor="middle" class="body">products DB</text>
  <text x="800" y="525" text-anchor="middle" class="head">order-service</text><text x="800" y="568" text-anchor="middle" class="body">발주 · 상태 관리</text><text x="800" y="608" text-anchor="middle" class="body">orders DB</text>
  <text x="1085" y="525" text-anchor="middle" class="head">payment-service</text><text x="1085" y="568" text-anchor="middle" class="body">결제 · 승인</text><text x="1085" y="608" text-anchor="middle" class="body">payments DB</text>
  <text x="1370" y="525" text-anchor="middle" class="head">recommend-service</text><text x="1370" y="568" text-anchor="middle" class="body">구매 이력 기반 추천</text><text x="1370" y="608" text-anchor="middle" class="body">미구매 제품 반환</text>

  <!-- kafka -->
  <rect x="640" y="725" width="300" height="110" rx="28" fill="#FFF4E8" stroke="#FF8A24" stroke-width="3" filter="url(#shadow)"/><text x="790" y="773" text-anchor="middle" class="head">Kafka</text><text x="790" y="811" text-anchor="middle" class="body">PaymentCompleted 이벤트</text>
  <text x="955" y="730" class="label" fill="#FF8A24">결제 완료 발행</text><text x="800" y="690" class="label" fill="#FF8A24">주문 상태 ACTIVE 반영</text>

  <rect x="70" y="820" width="18" height="18" rx="3" fill="#3478F6"/><text x="100" y="836" class="body">REST API: 조회·명령</text><rect x="330" y="820" width="18" height="18" rx="3" fill="#FF8A24"/><text x="360" y="836" class="body">Kafka: 비동기 이벤트</text>
</svg>
